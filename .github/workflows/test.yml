name: Go Test

on:
  push:
    branches: [master]
  pull_request:
  # Lets the release workflow run the tests before it publishes an image.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # The runner image ships Chrome, so the browser-based parser tests run here too.
      - name: Run tests
        run: go test ./...
